name: build-linux-experimental

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld curl git perl

      - name: Setup Theos (Linux)
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -sL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          cp -r /tmp/sdks/sdks-master/*.sdk "$THEOS/sdks/"

      - name: Install ldid
        run: |
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_aarch64 -o /tmp/ldid
          sudo install /tmp/ldid /usr/local/bin/ldid
          ldid -V || echo "ldid installed"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless || echo "构建可能失败，Linux 交叉编译 iOS tweak 不保证成功"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find packages -name '*.deb' -exec cp {} artifacts/ \; || true
          find . -name '*.dylib' -exec cp {} artifacts/ \; || true
          ls -la artifacts || echo "无产物"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: artifacts/*
          if-no-files-found: warn
